services:
  app:
    image: project-python-app:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: enterprise-ai-agent-app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/agent_db
      REDIS_URL: redis://redis:6379/0
      MILVUS_HOST: milvus
      MILVUS_PORT: "19530"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-https://api.deepseek.com}
      OPENAI_MODEL: ${OPENAI_MODEL:-deepseek-flash}
      OPENAI_THINKING: ${OPENAI_THINKING:-false}
      RAG_ENABLED: ${RAG_ENABLED:-false}
      RAG_TOP_K: ${RAG_TOP_K:-4}
      RAG_MAX_DISTANCE: ${RAG_MAX_DISTANCE:-1.1}
      RAG_COLLECTION_NAME: ${RAG_COLLECTION_NAME:-knowledge_chunks}
      RAG_RETRIEVAL_MODE: ${RAG_RETRIEVAL_MODE:-hybrid}
      RAG_CACHE_ENABLED: ${RAG_CACHE_ENABLED:-true}
      RAG_CACHE_TTL_SECONDS: ${RAG_CACHE_TTL_SECONDS:-3600}
      LOG_JSON: ${LOG_JSON:-false}
      TRACE_LOG_RETENTION_DAYS: ${TRACE_LOG_RETENTION_DAYS:-30}
      CONVERSATION_LOG_RETENTION_DAYS: ${CONVERSATION_LOG_RETENTION_DAYS:-90}
      REDIS_SOCKET_TIMEOUT: ${REDIS_SOCKET_TIMEOUT:-5.0}
      REDIS_SOCKET_CONNECT_TIMEOUT: ${REDIS_SOCKET_CONNECT_TIMEOUT:-5.0}
      REDIS_HEALTH_CHECK_INTERVAL: ${REDIS_HEALTH_CHECK_INTERVAL:-30}
      DATABASE_CONNECT_TIMEOUT: ${DATABASE_CONNECT_TIMEOUT:-5.0}
      DATABASE_COMMAND_TIMEOUT: ${DATABASE_COMMAND_TIMEOUT:-30.0}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-10}
      MILVUS_TIMEOUT: ${MILVUS_TIMEOUT:-10.0}
      CONVERSATION_PERSISTENCE_ENABLED: ${CONVERSATION_PERSISTENCE_ENABLED:-true}
      TRACE_PERSISTENCE_ENABLED: ${TRACE_PERSISTENCE_ENABLED:-true}
      AGENT_ORCHESTRATOR_ENABLED: ${AGENT_ORCHESTRATOR_ENABLED:-true}
      AGENT_MAX_STEPS: ${AGENT_MAX_STEPS:-8}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-models/bge-large-zh-v1.5}
      EMBEDDING_LOCAL_ONLY: ${EMBEDDING_LOCAL_ONLY:-true}
      RERANKER_MODEL: ${RERANKER_MODEL:-models/bge-reranker-v2-m3}
      RAG_RERANK_CANDIDATES: ${RAG_RERANK_CANDIDATES:-12}
      REFUND_ENABLED: ${REFUND_ENABLED:-false}
      REFUND_DATA_DIR: ${REFUND_DATA_DIR:-data/refund}
      REFUND_SEED_DATASET: ${REFUND_SEED_DATASET:-false}
    volumes:
      - ./app:/app/app
      - ./models:/app/models:ro
      - ./knowledge:/app/knowledge:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      milvus:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: enterprise-ai-agent-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agent_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agent_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: enterprise-ai-agent-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: enterprise-ai-agent-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: >
      etcd -advertise-client-urls=http://127.0.0.1:2379
      -listen-client-urls http://0.0.0.0:2379
      --data-dir /etcd
    volumes:
      - etcd_data:/etcd
    restart: unless-stopped

  minio:
    image: milvusdb/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: enterprise-ai-agent-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/minio_data
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.6.25
    container_name: enterprise-ai-agent-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_started
      minio:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  etcd_data:
  minio_data:
  milvus_data:
